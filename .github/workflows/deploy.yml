name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 boto3

      - name: Lint Python Code
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings check
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Unit Tests
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: mock-key-for-tests
          AWS_SECRET_ACCESS_KEY: mock-secret-for-tests
          AWS_SECURITY_TOKEN: mock-token-for-tests
          AWS_SESSION_TOKEN: mock-session-for-tests
          TABLE_NAME: test-table
          PYTHONPATH: backend
        run: |
          python -m unittest discover -s backend -p "test_*.py"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Validate Terraform Syntax
        run: |
          cd terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  deploy:
    name: Deploy to AWS
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Check AWS Secrets Availability
        id: check_aws
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          if [ -n "$AWS_KEY" ] && [ -n "$AWS_SECRET" ] && [ -n "$S3_BUCKET" ]; then
            echo "can_deploy=true" >> $GITHUB_OUTPUT
            echo "AWS credentials and S3 bucket found in secrets."
          else
            echo "can_deploy=false" >> $GITHUB_OUTPUT
            echo "AWS secrets not configured. Skipping automated deployment."
          fi

      - name: Configure AWS Credentials
        if: steps.check_aws.outputs.can_deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy Frontend to S3 & Invalidate CloudFront
        if: steps.check_aws.outputs.can_deploy == 'true'
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          CF_DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          echo "Syncing frontend files to S3 bucket $S3_BUCKET..."
          aws s3 sync frontend/ s3://$S3_BUCKET/ --delete

          if [ -n "$CF_DIST_ID" ]; then
            echo "Invalidating CloudFront cache..."
            aws cloudfront create-invalidation --distribution-id $CF_DIST_ID --paths "/*"
          fi
